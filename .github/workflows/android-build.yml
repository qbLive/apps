name: Android Release Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK metadata and alignment
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='com.xdreemb52.azhalha' versionCode='8' versionName='1.0.7'" /tmp/badging.txt
          "${ANDROID_HOME}/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          cp "$APK" "XDreemB52-Android-1.0.7-unsigned.apk"

      - name: Package Android signing tools
        shell: bash
        run: tar -czf android-build-tools-35.0.0.tgz -C "${ANDROID_HOME}/build-tools" 35.0.0

      - name: Upload release build
        uses: actions/upload-artifact@v4
        with:
          name: XDreemB52-Android-1.0.7-build
          path: |
            XDreemB52-Android-1.0.7-unsigned.apk
            android-build-tools-35.0.0.tgz
          if-no-files-found: error
